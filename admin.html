<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#0E3B2C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#0E3B2C; --verde2:#15503D; --verde3:#1C6049; --amarelo:#FFC93C; --off:#F4F1E8; --cinza:#C9D8D0;
  --suave:#9FBBAE; --linha:rgba(201,216,208,.16); --vermelho:#FF8A7A; --azul:#8CB8FF; --rosa:#F59BD0; --verdeok:#7FDCA4;
  --raio:18px; --titulo:'Space Grotesk',system-ui,sans-serif; --texto:'Inter',system-ui,sans-serif;
  --nav:68px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--verde);color:var(--off);font-family:var(--texto);font-size:16px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--amarelo)}
:focus-visible{outline:3px solid var(--amarelo);outline-offset:2px;border-radius:10px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Login */
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
.login-caixa{width:100%;max-width:380px}
.marca{display:flex;align-items:center;gap:10px;font-family:var(--titulo);font-weight:700;font-size:20px}
.tag{display:inline-block;white-space:nowrap;line-height:1.2;background:var(--verde2);border:1px solid var(--linha);border-radius:12px;padding:6px 9px;font-size:16px;letter-spacing:-.5px}
.tag b,.amarelo{color:var(--amarelo)}
.login h1{font-family:var(--titulo);font-size:28px;line-height:1.15;margin:28px 0 8px}
.login p{color:var(--cinza);line-height:1.5;margin-bottom:22px}
.campo{display:block;margin-bottom:14px}
.campo>span{display:block;font-size:14px;font-weight:600;color:var(--cinza);margin-bottom:6px}
.campo input,.campo select,.campo textarea{width:100%;background:var(--verde);border:1.5px solid var(--linha);border-radius:12px;padding:13px 14px;font-size:16px;min-height:48px}
.campo textarea{min-height:96px;resize:vertical;line-height:1.45}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--amarelo);outline:none}
.campo select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--cinza) 50%),linear-gradient(135deg,var(--cinza) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 18px;border-radius:14px;font-weight:700;text-decoration:none;font-size:15px;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn-amarelo{background:var(--amarelo);color:var(--verde)}
.btn-linha{border:1.5px solid var(--linha);color:var(--off)}
.btn-perigo{color:var(--vermelho);border:1.5px solid rgba(255,138,122,.35)}
.btn-cheio{width:100%}
.btn[disabled]{opacity:.55;pointer-events:none}
.erro{color:var(--vermelho);font-size:14px;min-height:20px;margin:-4px 0 10px}

/* Estrutura */
.topo{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));background:rgba(14,59,44,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--linha)}
.topo h1{font-family:var(--titulo);font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo .tag{padding:5px 8px;font-size:14px}
.icone-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--cinza)}
.icone-btn:active{background:var(--verde2)}
.girando svg{animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
main{padding:16px 16px calc(var(--nav) + 28px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
main:focus{outline:none}
.abas{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(10,46,34,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--linha);padding-bottom:env(safe-area-inset-bottom)}
.abas button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--nav);font-size:11px;font-weight:600;color:var(--suave)}
.abas button[aria-current="page"]{color:var(--amarelo)}
.abas button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 4px 4px;background:var(--amarelo)}
.bolinha{position:absolute;top:9px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--amarelo);color:var(--verde);font-size:11px;font-weight:800;display:grid;place-items:center}

/* Blocos */
.ola{font-family:var(--titulo);font-size:24px;line-height:1.2;margin:4px 0 4px}
.sub{color:var(--cinza);font-size:14px;margin-bottom:18px}
h2{font-family:var(--titulo);font-size:18px;margin:26px 0 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
h2 small{font-family:var(--texto);font-size:13px;font-weight:500;color:var(--suave)}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cartao{background:var(--verde2);border:1px solid var(--linha);border-radius:var(--raio);padding:16px}
.kpi{display:flex;flex-direction:column;gap:4px;text-align:left;min-height:118px;text-decoration:none;color:inherit}
.kpi .rot{font-size:13px;color:var(--cinza);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .rot svg{width:17px;height:17px;color:var(--amarelo)}
.kpi .num{font-family:var(--titulo);font-size:30px;font-weight:700;line-height:1.1;margin-top:auto;letter-spacing:-.5px;overflow-wrap:anywhere}
.kpi .num.din{font-size:22px}
.kpi .det{font-size:12.5px;color:var(--suave)}
.kpi.destaque{background:var(--amarelo);color:var(--verde);border-color:transparent}
.kpi.destaque .rot,.kpi.destaque .det,.kpi.destaque .rot svg{color:var(--verde)}
.delta{font-size:12.5px;font-weight:700}
.delta.sobe{color:var(--verdeok)} .delta.desce{color:var(--vermelho)} .delta.igual{color:var(--suave)}
.faixa{display:flex;gap:12px;align-items:flex-start;background:rgba(255,201,60,.1);border:1px solid rgba(255,201,60,.35);border-radius:14px;padding:14px;margin-bottom:14px;font-size:14px;line-height:1.45}
.faixa svg{color:var(--amarelo)}
.faixa.erro-f{background:rgba(255,138,122,.1);border-color:rgba(255,138,122,.4)}
.faixa.erro-f svg{color:var(--vermelho)}
.faixa .btn{min-height:40px;padding:8px 14px;margin-top:10px;font-size:14px}
.vazio{text-align:center;color:var(--cinza);padding:34px 16px;line-height:1.5;font-size:15px}
.vazio svg{width:40px;height:40px;color:var(--suave);margin-bottom:10px}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 4px;margin:0 -16px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--linha);font-size:14px;font-weight:600;color:var(--cinza);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--amarelo);border-color:var(--amarelo);color:var(--verde)}
.chip .n{font-size:12px;opacity:.75}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--verde);border:1.5px solid var(--linha);border-radius:14px;padding:4px;gap:4px;margin-bottom:16px}
.seg button{min-height:40px;border-radius:10px;font-weight:700;font-size:14px;color:var(--cinza)}
.seg button[aria-pressed="true"]{background:var(--verde3);color:var(--off)}
.seg.tipo button[aria-pressed="true"][data-v="entrada"]{background:var(--verdeok);color:var(--verde)}
.seg.tipo button[aria-pressed="true"][data-v="saida"]{background:var(--vermelho);color:var(--verde)}
.alternar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;margin:-4px 0 10px;font-size:14px;color:var(--cinza);font-weight:600;width:100%}
.alternar .trilho{width:46px;height:28px;border-radius:14px;background:var(--verde3);position:relative;transition:background .2s;flex:none}
.alternar .trilho::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--off);transition:transform .2s}
.alternar[aria-checked="true"] .trilho{background:var(--amarelo)}
.alternar[aria-checked="true"] .trilho::after{transform:translateX(18px);background:var(--verde)}

/* Listas */
.lista{display:flex;flex-direction:column;gap:2px;background:var(--verde2);border:1px solid var(--linha);border-radius:var(--raio);overflow:hidden}
.msg{position:relative;display:flex;gap:12px;width:100%;text-align:left;padding:14px;border-bottom:1px solid var(--linha);align-items:flex-start;min-height:72px}
.msg:last-child{border-bottom:0}
.msg:active{background:var(--verde3)}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.ic svg{width:20px;height:20px}
.ic-email{background:rgba(140,184,255,.16);color:var(--azul)}
.ic-instagram{background:rgba(245,155,208,.16);color:var(--rosa)}
.ic-site,.ic-whatsapp,.ic-chat{background:rgba(127,220,164,.16);color:var(--verdeok)}
.ic-outro{background:rgba(201,216,208,.12);color:var(--cinza)}
.msg-corpo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.msg-linha{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.msg-linha b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-linha time{font-size:12px;color:var(--suave);flex:none}
.msg-assunto{font-size:14px;color:var(--off);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-texto{font-size:13.5px;color:var(--cinza);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4}
.msg.pendente .msg-linha b{color:var(--amarelo)}
.ponto{position:absolute;right:14px;bottom:16px;width:10px;height:10px;border-radius:50%;background:var(--amarelo)}
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.st-novo{background:rgba(255,201,60,.18);color:var(--amarelo)}
.st-conversando{background:rgba(140,184,255,.18);color:var(--azul)}
.st-orcamento{background:rgba(245,155,208,.18);color:var(--rosa)}
.st-fechado{background:rgba(127,220,164,.2);color:var(--verdeok)}
.st-perdido{background:rgba(201,216,208,.12);color:var(--suave)}
.linha-fin{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-bottom:1px solid var(--linha);min-height:64px}
.linha-fin:last-child{border-bottom:0}
.linha-fin:active{background:var(--verde3)}
.linha-fin .meio{flex:1;min-width:0}
.linha-fin .meio b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linha-fin .meio span{font-size:12.5px;color:var(--suave)}
.valor{font-family:var(--titulo);font-weight:700;font-size:16px;white-space:nowrap}
.valor.entrada{color:var(--verdeok)} .valor.saida{color:var(--vermelho)}
.valor small{display:block;text-align:right;font-family:var(--texto);font-size:11px;font-weight:600;color:var(--amarelo)}

/* Gráficos */
.graf{width:100%;height:auto;display:block}
.graf text{fill:var(--suave);font-size:10px;font-family:var(--texto)}
.legenda{display:flex;gap:16px;font-size:12.5px;color:var(--cinza);margin-top:8px}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.barras{display:flex;flex-direction:column;gap:12px}
.barra-l{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.barra-l .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra-l .v{font-weight:700;font-size:13.5px}
.barra-l .trilho{grid-column:1/-1;height:8px;border-radius:4px;background:var(--verde);overflow:hidden}
.barra-l .trilho i{display:block;height:100%;border-radius:4px;background:var(--amarelo)}
.funil{display:flex;flex-direction:column;gap:8px}
.funil-l{display:grid;grid-template-columns:96px 1fr 34px;gap:10px;align-items:center;font-size:13.5px}
.funil-l .trilho{height:26px;border-radius:8px;background:var(--verde);overflow:hidden}
.funil-l .trilho i{display:block;height:100%;border-radius:8px}
.funil-l b{text-align:right}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.trio .cartao{padding:14px 10px;text-align:center}
.trio b{display:block;font-family:var(--titulo);font-size:24px}
.trio span{font-size:12px;color:var(--cinza)}
.mes-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}
.mes-nav b{font-family:var(--titulo);font-size:18px}

/* Carregando */
.esqueleto{background:linear-gradient(90deg,var(--verde2) 0%,var(--verde3) 50%,var(--verde2) 100%);background-size:200% 100%;animation:brilho 1.2s infinite;border-radius:var(--raio)}
@keyframes brilho{to{background-position:-200% 0}}

/* Botão flutuante */
.fab{position:fixed;right:16px;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom));z-index:5;width:58px;height:58px;border-radius:18px;background:var(--amarelo);color:var(--verde);display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.fab svg{width:26px;height:26px;stroke-width:2.5}

/* Folha (janela de baixo) */
.folha{position:fixed;inset:0;z-index:28;display:flex;align-items:flex-end;justify-content:center}
.folha-fundo{position:absolute;inset:0;background:rgba(3,20,14,.6);animation:aparece .2s}
.folha-caixa{position:relative;width:100%;max-width:640px;max-height:92vh;max-height:92dvh;overflow-y:auto;background:var(--verde2);border-radius:24px 24px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));animation:sobe .25s ease-out;overscroll-behavior:contain}
.folha-alca{width:42px;height:5px;border-radius:3px;background:var(--linha);margin:4px auto 14px}
.folha h3{font-family:var(--titulo);font-size:21px;margin-bottom:4px;padding-right:44px}
.folha .fechar{position:absolute;top:12px;right:10px}
.folha .acoes{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.folha .lado{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* Tela de conversa */
.chat{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;background:var(--verde)}
.chat-topo{display:flex;align-items:center;gap:8px;padding:8px 8px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--verde2);border-bottom:1px solid var(--linha)}
.av{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--titulo);font-weight:700;font-size:17px;background:rgba(245,155,208,.18);color:var(--rosa)}
.av-chat,.av-site{background:rgba(127,220,164,.16);color:var(--verdeok)}
.av-email{background:rgba(140,184,255,.16);color:var(--azul)}
.av .selo{position:absolute;right:-4px;bottom:-4px;width:19px;height:19px;border-radius:50%;background:var(--verde2);display:grid;place-items:center;border:1.5px solid var(--verde)}
.av .selo svg{width:11px;height:11px}
.chat-quem{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.chat-quem b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-quem span{font-size:12.5px;color:var(--suave)}
.chat-msgs{flex:1;overflow-y:auto;padding:10px 10px 8px;overscroll-behavior:contain}
.chat-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:3px}
.dia{align-self:center;font-size:12px;font-weight:600;color:var(--cinza);background:var(--verde2);padding:4px 11px;border-radius:8px;margin:10px 0 6px}
.mais-antigas{align-self:center;margin:4px 0 8px}
.b-linha{display:flex;align-items:center;gap:4px}
.b-linha.eu{flex-direction:row-reverse}
.bolha2{max-width:78%;background:var(--verde2);border-radius:14px 14px 14px 4px;padding:7px 10px 6px;font-size:15px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere;transition:transform .15s}
.eu .bolha2{background:var(--amarelo);color:#0E3B2C;border-radius:14px 14px 4px 14px}
.bolha2.enviando{opacity:.6}
.bolha2 time{float:right;font-size:11px;opacity:.7;margin:7px 0 0 10px;line-height:1}
.b-linha.marcada .bolha2{box-shadow:0 0 0 2px var(--off)}
.b-resp{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--cinza);opacity:.4;flex:none}
.b-resp svg{width:17px;height:17px}
.b-resp:hover,.b-resp:focus-visible,.b-linha:hover .b-resp{opacity:1}
.b-resp:hover{background:var(--verde2)}
.cit{display:block;border-left:3px solid var(--rosa);background:rgba(0,0,0,.16);border-radius:8px;padding:5px 8px;margin-bottom:5px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cit b{display:block;font-size:12px}
.eu .cit{border-left-color:#0E3B2C;background:rgba(14,59,44,.12)}
.chat-pe{background:var(--verde2);border-top:1px solid var(--linha);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.chat-pe>*{max-width:760px;margin-left:auto;margin-right:auto}
.chat-aviso{font-size:13.5px;line-height:1.45;color:var(--cinza);text-align:center;margin:4px auto 8px}
.cit-barra{display:flex;align-items:center;gap:6px;border-left:3px solid var(--amarelo);background:var(--verde);border-radius:10px;padding:4px 4px 4px 10px;margin-bottom:8px}
.cit-barra[hidden]{display:none}
.cit-barra div{flex:1;min-width:0}
.cit-barra b{display:block;font-size:12.5px;color:var(--amarelo)}
.cit-barra span{display:block;font-size:13.5px;color:var(--cinza);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-form{display:flex;align-items:flex-end;gap:8px}
.chat-form textarea{flex:1;resize:none;background:var(--verde);border:1.5px solid var(--linha);border-radius:22px;padding:11px 16px;font-size:16px;line-height:1.35;min-height:46px;max-height:140px}
.chat-form textarea:focus{border-color:var(--amarelo);outline:none}
.enviar{width:46px;height:46px;border-radius:50%;background:var(--amarelo);color:#0E3B2C;display:grid;place-items:center;flex:none}
.enviar:disabled{opacity:.5}
.enviar svg{width:20px;height:20px}
.enviar:focus-visible,.b-resp:focus-visible{outline:3px solid var(--off);outline-offset:2px}
.chat-erro{margin:6px auto 0;min-height:0}
.msg .av{width:44px;height:44px}
.msg-texto .voce{color:var(--suave)}
.detalhe{background:var(--verde);border-radius:14px;padding:14px;margin:14px 0;line-height:1.55;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--cinza);margin-top:6px}
.passos{padding-left:20px;line-height:1.6;font-size:14px;color:var(--cinza)}
.passos li{margin-bottom:6px}
details.ajuda{margin-top:12px}
details.ajuda summary{cursor:pointer;font-weight:700;color:var(--amarelo);min-height:44px;display:flex;align-items:center}
@keyframes sobe{from{transform:translateY(100%)}}
@keyframes aparece{from{opacity:0}}

.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom));z-index:30;max-width:520px;margin:0 auto;background:var(--off);color:var(--verde);border-radius:14px;padding:14px 16px;font-weight:600;font-size:14.5px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 12px 30px rgba(0,0,0,.35);transform:translateY(30px);opacity:0;visibility:hidden;transition:transform .25s,opacity .25s,visibility .25s}
.toast.on{transform:none;opacity:1;visibility:visible}
.toast button{color:var(--verde);font-weight:800;text-decoration:underline;min-height:36px;white-space:nowrap}

@media (min-width:720px){
  .grade.quatro{grid-template-columns:repeat(4,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
(function () {
  'use strict';

  /* ───────── Estado ───────── */
  var S = {
    token: lerToken(), aba: 'inicio', cache: {},
    filtroMsg: 'todas', soPendentes: false, filtroCont: 'todos',
    dias: 30, mes: mesDeHoje(), msgs: [], contatos: [], lancamentos: [],
    canais: ['Site', 'WhatsApp', 'Instagram', 'E-mail', 'Indicação', 'Outro'],
    etapas: ['novo', 'conversando', 'orcamento', 'fechado', 'perdido'],
    formas: ['Pix', 'Cartão', 'Boleto', 'Dinheiro', 'Transferência', 'Mercado Pago', 'Outro']
  };
  var NOMES_ETAPA = { novo: 'Novo', conversando: 'Conversando', orcamento: 'Orçamento enviado', fechado: 'Fechado', perdido: 'Perdido' };
  var CORES_ETAPA = { novo: '#FFC93C', conversando: '#8CB8FF', orcamento: '#F59BD0', fechado: '#7FDCA4', perdido: '#6F8F82' };
  var TITULOS = { inicio: 'Início', mensagens: 'Chats', contatos: 'Contatos', marketing: 'Marketing', financas: 'Finanças', ajustes: 'Ajustes' };
  var CANAL_ICONE = { email: 'i-email', instagram: 'i-instagram', site: 'i-site', whatsapp: 'i-whatsapp', chat: 'i-chat' };
  var CANAL_NOME = { email: 'E-mail', instagram: 'Instagram', site: 'Site', whatsapp: 'WhatsApp', chat: 'Chat do site' };
  var QUIZ = { landing: 'Landing page', site: 'Site institucional', loja: 'Loja virtual', sistema: 'Sistema sob medida' };

  var $ = function (s, el) { return (el || document).querySelector(s); };
  var $$ = function (s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); };
  var conteudo = $('#conteudo');

  function lerToken() { try { return localStorage.getItem('bzk_token') || ''; } catch (e) { return ''; } }
  function guardarToken(t) { S.token = t || ''; try { if (t) localStorage.setItem('bzk_token', t); else localStorage.removeItem('bzk_token'); } catch (e) {} }

  /* ───────── Conversa com o servidor ───────── */
  // Dentro do Google usa google.script.run; no site (admin.html) conversa por fetch,
  // sem cookies, então as contas Google do navegador não atrapalham.
  var REMOTO = window.PAINEL_API || '';
  function rodar(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    if (!(window.google && google.script && google.script.run)) {
      if (!REMOTO) return Promise.reject(new Error('Painel sem endereço do servidor.'));
      return fetch(REMOTO, {
        method: 'POST', credentials: 'omit', redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ tipo: 'painel', fn: fn, args: args })
      }).then(function (r) { return r.json(); }, function () {
        throw new Error('Sem conexão com o servidor. Confira a internet e tente de novo.');
      }).then(function (j) {
        if (!j || !j.ok) throw new Error((j && j.erro) || 'Algo deu errado');
        return j.r;
      });
    }
    return new Promise(function (ok, falha) {
      var r = google.script.run.withSuccessHandler(ok).withFailureHandler(falha);
      r[fn].apply(r, args);
    });
  }
  function textoErro(e) { return String((e && e.message) || e || 'Algo deu errado').replace(/^(Error|Exception):\s*/, ''); }
  function api(acao, dados) {
    return rodar('api', S.token, acao, dados || null).catch(function (e) {
      var m = textoErro(e);
      if (m.indexOf('SESSAO') >= 0) { guardarToken(''); mostrarLogin('Sua sessão expirou. Entre de novo.'); throw new Error('Entre de novo.'); }
      throw new Error(m);
    });
  }

  /* ───────── Formatação ───────── */
  var fmtBRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  var fmtNum = new Intl.NumberFormat('pt-BR');
  function brl(v) { return fmtBRL.format(Number(v) || 0); }
  function num(v) { return fmtNum.format(Number(v) || 0); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function ic(id, cls) { return '<svg class="i ' + (cls || '') + '" aria-hidden="true"><use href="#' + id + '"/></svg>'; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function mesDeHoje() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
  function hojeISO() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function nomeMes(m) { var p = m.split('-'); var t = new Date(+p[0], +p[1] - 1, 15).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }); return t.charAt(0).toUpperCase() + t.slice(1); }
  function mesCurto(m) { var p = m.split('-'); return new Date(+p[0], +p[1] - 1, 15).toLocaleDateString('pt-BR', { month: 'short' }).replace('.', ''); }
  function somaMes(m, n) { var p = m.split('-'); var d = new Date(+p[0], +p[1] - 1 + n, 15); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
  function dataBR(iso) { if (!iso) return ''; var p = String(iso).slice(0, 10).split('-'); return p[2] + '/' + p[1]; }
  function relativo(iso) {
    var t = Date.parse(iso); if (isNaN(t)) return '';
    var s = (Date.now() - t) / 1000;
    if (s < 60) return 'agora';
    if (s < 3600) return 'há ' + Math.floor(s / 60) + ' min';
    var d = new Date(t), h = new Date();
    if (d.toDateString() === h.toDateString()) return 'há ' + Math.floor(s / 3600) + ' h';
    var ontem = new Date(); ontem.setDate(ontem.getDate() - 1);
    if (d.toDateString() === ontem.toDateString()) return 'ontem';
    if (s < 6 * 86400) return d.toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '');
    return pad(d.getDate()) + '/' + pad(d.getMonth() + 1);
  }
  function completo(iso) { var t = Date.parse(iso); return isNaN(t) ? '' : new Date(t).toLocaleString('pt-BR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }); }
  function saudacao() { var h = new Date().getHours(); return h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite'; }
  function delta(atual, antes) {
    if (!antes && !atual) return '<span class="delta igual">sem dados antes</span>';
    if (!antes) return '<span class="delta sobe">novo</span>';
    var p = Math.round((atual - antes) / antes * 100);
    return '<span class="delta ' + (p > 0 ? 'sobe' : p < 0 ? 'desce' : 'igual') + '">' + (p > 0 ? '▲ ' : p < 0 ? '▼ ' : '') + Math.abs(p) + '% vs. antes</span>';
  }
  function linkContato(c) {
    var v = String(c || '').trim();
    if (!v) return null;
    if (v.indexOf('@') === 0) return { href: 'https://ig.me/m/' + encodeURIComponent(v.slice(1)), txt: 'Abrir no Instagram', ic: 'i-instagram' };
    if (/\S+@\S+\.\S+/.test(v)) return { href: 'mailto:' + v, txt: 'Mandar e-mail', ic: 'i-email' };
    var d = v.replace(/\D/g, '');
    if (d.length >= 10) { if (d.length <= 11) d = '55' + d; return { href: 'https://wa.me/' + d, txt: 'Abrir no WhatsApp', ic: 'i-whatsapp' }; }
    return null;
  }
  function lerValor(s) { s = String(s || '').replace(/[R$\s]/g, ''); if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.'); var n = parseFloat(s); return isNaN(n) ? 0 : n; }
  function valorCampo(n) { return n ? Number(n).toFixed(2).replace('.', ',') : ''; }

  /* ───────── Avisos rápidos ───────── */
  var tempoToast;
  function avisar(txt, acao, fn) {
    $('#toast-txt').textContent = txt;
    var b = $('#toast-acao');
    if (acao) { b.hidden = false; b.textContent = acao; b.onclick = function () { $('#toast').classList.remove('on'); fn(); }; } else { b.hidden = true; }
    $('#toast').classList.add('on');
    clearTimeout(tempoToast);
    tempoToast = setTimeout(function () { $('#toast').classList.remove('on'); }, acao ? 7000 : 3200);
  }

  /* ───────── Login ───────── */
  var modoCriar = false;
  function mostrarLogin(msg) {
    $('#painel').hidden = true; fecharFolha();
    $('#tela-login').hidden = false;
    $('#login-erro').textContent = msg || '';
    rodar('temSenha').then(function (tem) {
      modoCriar = !tem;
      $('#login-titulo').textContent = tem ? 'Bem-vindo de volta' : 'Crie sua senha';
      $('#login-texto').textContent = tem ? 'Digite a senha do painel para ver mensagens, contatos e números da Brazuka Web.' : 'É o primeiro acesso. Escolha uma senha com pelo menos 6 caracteres. Só quem tiver ela entra no painel.';
      $('#campo-confirma').hidden = tem;
      $('#senha').setAttribute('autocomplete', tem ? 'current-password' : 'new-password');
      $('#login-btn').textContent = tem ? 'Entrar' : 'Criar senha e entrar';
      $('#form-login').hidden = false;
      $('#senha').focus();
    }).catch(function (e) { $('#login-texto').textContent = 'Não consegui falar com o painel: ' + textoErro(e); });
  }
  $('#form-login').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var s = $('#senha').value, erro = $('#login-erro'), btn = $('#login-btn');
    if (s.length < 6) { erro.textContent = 'A senha precisa ter pelo menos 6 caracteres.'; return; }
    if (modoCriar && s !== $('#senha2').value) { erro.textContent = 'As duas senhas não são iguais.'; return; }
    erro.textContent = ''; btn.disabled = true; btn.textContent = 'Entrando…';
    rodar(modoCriar ? 'criarSenha' : 'entrar', s).then(function (t) {
      guardarToken(t); $('#senha').value = ''; $('#senha2').value = '';
      abrirPainel();
    }).catch(function (e) { erro.textContent = textoErro(e); }).then(function () { btn.disabled = false; btn.textContent = modoCriar ? 'Criar senha e entrar' : 'Entrar'; });
  });

  /* ───────── Navegação ───────── */
  function abrirPainel() {
    $('#tela-login').hidden = true; $('#painel').hidden = false;
    ir(S.aba);
  }
  $$('.abas button').forEach(function (b) { b.addEventListener('click', function () { ir(b.dataset.aba); }); });
  $('#btn-ajustes').addEventListener('click', function () { ir('ajustes'); });
  $('#btn-atualizar').addEventListener('click', function () { ir(S.aba, true); });

  var VIEWS = {};
  var pedido = 0;
  function ir(aba, forcar) {
    var mudou = aba !== S.aba;
    S.aba = aba;
    $('#titulo').textContent = TITULOS[aba];
    $$('.abas button').forEach(function (b) { if (b.dataset.aba === aba) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    if (mudou) { window.scrollTo(0, 0); }
    var v = VIEWS[aba];
    var chave = v.chave ? v.chave() : aba;
    if (S.cache[chave]) v.render(S.cache[chave]); else conteudo.innerHTML = esqueleto();
    var meu = ++pedido;
    var btn = $('#btn-atualizar'); btn.classList.add('girando');
    v.buscar(!!forcar).then(function (d) {
      S.cache[chave] = d;
      if (meu === pedido && S.aba === aba) v.render(d);
    }).catch(function (e) {
      if (meu === pedido && S.aba === aba && !S.cache[chave]) conteudo.innerHTML = faixaErro(textoErro(e));
      else avisar(textoErro(e));
    }).then(function () { if (meu === pedido) btn.classList.remove('girando'); });
  }
  function recarregar() { ir(S.aba, true); }
  function esqueleto() {
    return '<div class="esqueleto" style="height:28px;width:60%;margin:6px 0 20px"></div><div class="grade"><div class="esqueleto" style="height:118px"></div><div class="esqueleto" style="height:118px"></div><div class="esqueleto" style="height:118px"></div><div class="esqueleto" style="height:118px"></div></div><div class="esqueleto" style="height:240px;margin-top:24px"></div>';
  }
  function faixaErro(m) { return '<div class="faixa erro-f">' + ic('i-alerta') + '<div>' + esc(m) + '<br><button class="btn btn-linha" type="button" data-acao="recarregar">Tentar de novo</button></div></div>'; }
  function bolinha(id, n) { var b = $(id); b.hidden = !n; b.textContent = n > 99 ? '99+' : n; }

  /* Cliques gerais (delegação) */
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-acao]');
    if (!el) return;
    var a = el.dataset.acao;

  function linhaLanc(l) {
    var pend = l.status === 'pendente';
    return '<button type="button" class="linha-fin" data-acao="lanc" data-id="' + esc(l.id) + '"><span class="ic ic-' + (l.tipo === 'entrada' ? 'site' : 'outro') + '">' + ic(l.tipo === 'entrada' ? 'i-seta-d' : 'i-seta-e') + '</span><span class="meio"><b>' + esc(l.descricao) + '</b><span>' + dataBR(l.data) + (l.cliente ? ' · ' + esc(l.cliente) : '') + ' · ' + esc(l.forma) + '</span></span><span class="valor ' + l.tipo + '">' + (l.tipo === 'saida' ? '− ' : '+ ') + brl(l.valor) + (pend ? '<small>' + (l.tipo === 'entrada' ? 'a receber' : 'a pagar') + '</small>' : '') + '</span></button>';
  }
  function graficoMeses(meses) {
    var W = 340, H = 150, base = 126, n = meses.length;
    var max = Math.max(1, Math.max.apply(null, meses.map(function (m) { return Math.max(m.entrou, m.saiu); })));
    var grupo = W / n, larg = Math.min(18, grupo / 3);
    var svg = '<svg class="graf" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Entradas e saídas dos últimos 6 meses">';
    meses.forEach(function (m, i) {
      var x = i * grupo + grupo / 2;
      var he = m.entrou ? Math.max(3, (base - 14) * m.entrou / max) : 1.5, hs = m.saiu ? Math.max(3, (base - 14) * m.saiu / max) : 1.5;
      svg += '<rect x="' + (x - larg - 2) + '" y="' + (base - he) + '" width="' + larg + '" height="' + he + '" rx="3" fill="#7FDCA4"><title>' + mesCurto(m.mes) + ': entrou ' + brl(m.entrou) + '</title></rect>';
      svg += '<rect x="' + (x + 2) + '" y="' + (base - hs) + '" width="' + larg + '" height="' + hs + '" rx="3" fill="#FF8A7A"><title>' + mesCurto(m.mes) + ': saiu ' + brl(m.saiu) + '</title></rect>';
      svg += '<text x="' + x + '" y="' + (H - 6) + '" text-anchor="middle"' + (m.mes === S.mes ? ' style="fill:#FFC93C;font-weight:700"' : '') + '>' + mesCurto(m.mes) + '</text>';
    });
    return svg + '</svg>';
  }
  function abrirLancamento(l, pre) {
    var novo = !l;
    l = l || Object.assign({ tipo: 'entrada', data: hojeISO(), forma: 'Pix', status: 'pago', canal: '' }, pre || {});
    var tipo = l.tipo, status = l.status;
    function desenhar() {
      var ent = tipo === 'entrada';
      var h = '<h3 id="folha-titulo">' + (novo ? 'Novo lançamento' : 'Editar lançamento') + '</h3>' +
        '<form id="form-lanc" novalidate style="margin-top:14px">' +
        '<div class="seg tipo" role="group" aria-label="Tipo"><button type="button" data-tipo data-v="entrada" aria-pressed="' + ent + '">Entrada</button><button type="button" data-tipo data-v="saida" aria-pressed="' + !ent + '">Saída</button></div>' +
        '<div class="lado"><label class="campo"><span>Valor (R$)</span><input name="valor" inputmode="decimal" placeholder="0,00" value="' + esc(valorCampo(l.valor)) + '" required></label>' +
        '<label class="campo"><span>Data</span><input name="data" type="date" value="' + esc(l.data) + '" required></label></div>' +
        '<label class="campo"><span>Descrição</span><input name="descricao" value="' + esc(l.descricao) + '" placeholder="' + (ent ? 'Ex.: entrada do site da confeitaria' : 'Ex.: domínio, hospedagem, anúncio') + '" required></label>' +
        (ent ? '<label class="campo"><span>Cliente</span><input name="cliente" value="' + esc(l.cliente) + '" autocomplete="off"></label>' : '<label class="campo"><span>Fornecedor (opcional)</span><input name="cliente" value="' + esc(l.cliente) + '" autocomplete="off"></label>') +
        '<div class="lado">' + (ent ? '<label class="campo"><span>Veio pelo</span><select name="canal"><option value="">Escolha</option>' + opcoes(S.canais, l.canal) + '</select></label>' : '') +
        '<label class="campo"' + (ent ? '' : ' style="grid-column:1/-1"') + '><span>Forma</span><select name="forma">' + opcoes(S.formas, l.forma) + '</select></label></div>' +
        '<div class="seg" role="group" aria-label="Situação"><button type="button" data-status data-v="pago" aria-pressed="' + (status === 'pago') + '">' + (ent ? 'Já recebi' : 'Já paguei') + '</button><button type="button" data-status data-v="pendente" aria-pressed="' + (status === 'pendente') + '">' + (ent ? 'A receber' : 'A pagar') + '</button></div>' +
        '<p class="erro" id="lanc-erro" role="alert"></p>' +
        '<div class="acoes"><button class="btn btn-amarelo" type="submit">Salvar</button>' + (novo ? '' : '<button class="btn btn-perigo" type="button" id="apagar-lanc">Apagar lançamento</button>') + '</div></form>';
      abrirFolha(h);
      var f = $('#form-lanc');
      $$('[data-tipo]', f).forEach(function (b) { b.addEventListener('click', function () { guardarCampos(f); tipo = b.dataset.v; desenhar(); }); });
      $$('[data-status]', f).forEach(function (b) { b.addEventListener('click', function () { status = b.dataset.v; $$('[data-status]', f).forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); }); });
      f.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var d = { id: l.id || '', tipo: tipo, status: status, valor: lerValor(f.valor.value), data: f.data.value, descricao: f.descricao.value, cliente: f.cliente.value, canal: f.canal ? f.canal.value : '', forma: f.forma.value };
        var erro = $('#lanc-erro');
        if (!(d.valor > 0)) { erro.textContent = 'Coloque o valor.'; f.valor.focus(); return; }
        if (!d.descricao.trim()) { erro.textContent = 'Escreva uma descrição.'; f.descricao.focus(); return; }
        var btn = f.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = 'Salvando…';
        api('salvarLancamento', d).then(function () {
          limparFinancas(); fecharFolha();
          S.mes = d.data.slice(0, 7) <= mesDeHoje() ? d.data.slice(0, 7) : S.mes;
          if (S.aba === 'financas') recarregar(); else ir('financas');
          avisar('Lançamento salvo.');
        }).catch(function (e) { erro.textContent = textoErro(e); btn.disabled = false; btn.textContent = 'Tentar de novo'; });
      });
      var ap = $('#apagar-lanc');
      if (ap) confirmarDuplo(ap, 'Toque de novo para apagar', function () {
        return api('apagarLancamento', { id: l.id }).then(function () { limparFinancas(); fecharFolha(); recarregar(); avisar('Lançamento apagado.'); });
      });
    }
    function guardarCampos(f) { l = Object.assign({}, l, { valor: lerValor(f.valor.value), data: f.data.value, descricao: f.descricao.value, cliente: f.cliente.value, forma: f.forma.value, canal: f.canal ? f.canal.value : l.canal }); }
    desenhar();
  }
  function limparFinancas() { Object.keys(S.cache).forEach(function (k) { if (k.indexOf('financas') === 0 || k === 'inicio') delete S.cache[k]; }); }

  /* ───────── Ajustes ───────── */
  VIEWS.ajustes = {
    buscar: function () { return api('ajustes'); },
    render: function (a) {
      var h = '<h2 style="margin-top:4px">Instagram</h2><div class="cartao">';
      if (a.instagram) {
        h += '<p style="display:flex;align-items:center;gap:10px"><span class="ic ic-instagram">' + ic('i-instagram') + '</span><span><b>@' + esc(a.igUsuario) + '</b><br><span class="sub" style="margin:0">Conectado. O token é renovado sozinho.</span></span></p>' +
          '<div class="acoes" style="margin-top:14px"><button class="btn btn-perigo" type="button" id="ig-desligar">Desconectar</button></div>';
      } else {
        h += '<p class="sub" style="margin-bottom:12px">Cole aqui o token de acesso do Instagram da Brazuka. Com ele, o painel mostra os Directs e os números do perfil.</p>' +
          '<form id="form-ig" novalidate><label class="campo"><span>Token do Instagram</span><textarea name="token" rows="3" autocomplete="off" spellcheck="false" placeholder="Começa com IGAA…"></textarea></label><p class="erro" id="ig-erro" role="alert"></p><button class="btn btn-amarelo btn-cheio" type="submit">Conectar Instagram</button></form>' +
          '<details class="ajuda"><summary>Como pegar o token</summary><ol class="passos">' +
          '<li>O Instagram da Brazuka precisa ser conta <b>Profissional</b> (Empresa ou Criador).</li>' +
          '<li>Entre em <b>developers.facebook.com</b>, crie um app do tipo <b>Empresa</b> e adicione o produto <b>Instagram</b>.</li>' +
          '<li>Em “API com login do Instagram”, adicione a conta @brazuka.web e toque em <b>Gerar token</b>.</li>' +
          '<li>Copie o token e cole aqui. O Claude Code pode fazer esses passos com você.</li></ol></details>';
      }
      h += '</div>';
      h += '<h2>Atendente com IA</h2><div class="cartao">';
      if (a.ia) {
        h += '<p style="display:flex;align-items:center;gap:10px"><span class="ic ic-chat">' + ic('i-chat') + '</span><span><b>' + (a.iaLigada ? 'Ligado no site' : 'Desligado') + '</b><br><span class="sub" style="margin:0">' + num(a.iaHoje) + ' de ' + num(a.iaLimite) + ' respostas usadas hoje</span></span></p>' +
          '<div class="acoes" style="margin-top:14px"><button class="btn ' + (a.iaLigada ? 'btn-linha' : 'btn-amarelo') + '" type="button" id="ia-ligar">' + (a.iaLigada ? 'Desligar o atendente' : 'Ligar o atendente') + '</button><button class="btn btn-perigo" type="button" id="ia-apagar">Remover a chave</button></div>';
      } else {
        h += '<p class="sub" style="margin-bottom:12px">O balãozinho de chat do site só aparece depois que uma chave da IA for colocada aqui. Cada resposta custa alguns centavos, cobrados na conta da Anthropic.</p>' +
          '<form id="form-ia" novalidate><label class="campo"><span>Chave da IA (Anthropic)</span><textarea name="chave" rows="2" autocomplete="off" spellcheck="false" placeholder="Começa com sk-ant-…"></textarea></label><p class="erro" id="ia-erro" role="alert"></p><button class="btn btn-amarelo btn-cheio" type="submit">Salvar chave e ligar</button></form>' +
          '<details class="ajuda"><summary>Como pegar a chave</summary><ol class="passos">' +
          '<li>Um adulto (seu pai) cria uma conta em <b>platform.claude.com</b>, porque precisa de cartão.</li>' +
          '<li>Em <b>Billing</b>, coloca um crédito pequeno para começar e define um limite de gasto por mês.</li>' +
          '<li>Em <b>API Keys</b>, toca em <b>Create Key</b> e copia a chave.</li>' +
          '<li>Cola aqui. A chave fica guardada só no painel, nunca no site.</li></ol></details>';
      }
      h += '</div>';
      h += '<h2>O que o atendente precisa saber</h2><div class="cartao"><p class="sub" style="margin-bottom:12px">Escreva aqui informações e regras extras para o atendente usar nas respostas: perguntas que os clientes fazem, recados, o que ele não deve falar. Ele já sabe tudo o que está no site.</p>' +
        '<form id="form-treino" novalidate><label class="campo"><span>Instruções extras</span><textarea name="texto" rows="6" maxlength="4000" placeholder="Ex.: Se perguntarem sobre manutenção mensal, dizer que isso é combinado na proposta.">' + esc(a.iaExtra) + '</textarea></label><p class="erro" id="treino-erro" role="alert"></p><button class="btn btn-linha btn-cheio" type="submit">Salvar instruções</button></form></div>';
      h += '<h2>Seus dados</h2><div class="lista">' +
        '<a class="linha-fin" href="' + esc(a.planilha) + '" target="_blank" rel="noopener" style="text-decoration:none;color:inherit"><span class="ic ic-outro">' + ic('i-grafico') + '</span><span class="meio"><b>Abrir planilha com tudo</b><span>Contatos, finanças e visitas ficam guardados nela</span></span>' + ic('i-externo') + '</a>' +
        '<div class="linha-fin"><span class="ic ic-email">' + ic('i-email') + '</span><span class="meio"><b>Gmail lido pelo painel</b><span>' + esc(a.email) + '</span></span></div>' +
        '</div>';
      h += '<h2>Senha</h2><div class="cartao"><form id="form-senha" novalidate>' +
        '<label class="campo"><span>Senha atual</span><input name="atual" type="password" autocomplete="current-password"></label>' +
        '<label class="campo"><span>Nova senha</span><input name="nova" type="password" autocomplete="new-password"></label>' +
        '<button class="btn btn-linha btn-cheio" type="button" id="gerar-senha" style="margin-bottom:10px">' + ic('i-atualizar') + 'Gerar senha forte</button>' +
        '<p class="sub" id="senha-gerada" style="margin:0 0 10px" hidden></p>' +
        '<p class="erro" id="senha-erro" role="alert"></p><button class="btn btn-linha btn-cheio" type="submit">' + ic('i-cadeado') + 'Trocar senha</button>' +
        '<p class="sub" style="margin:10px 0 0">Ao trocar, todos os outros aparelhos saem do painel.</p></form></div>';
      h += '<h2>No celular</h2><div class="cartao"><p class="sub" style="margin:0;line-height:1.55">Para abrir o painel como um aplicativo: no Chrome do Android, toque em <b>⋮</b> e depois em <b>Adicionar à tela inicial</b>. No iPhone, abra no Safari, toque em <b>Compartilhar</b> e depois em <b>Adicionar à Tela de Início</b>.</p></div>';
      h += '<div class="acoes" style="margin-top:22px"><button class="btn btn-linha" type="button" id="sair">' + ic('i-sair') + 'Sair deste aparelho</button></div>';
      conteudo.innerHTML = h;

      var fig = $('#form-ig');
      if (fig) fig.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var btn = fig.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = 'Conectando…';
        api('salvarInstagram', { token: fig.token.value }).then(function (r) { S.cache = {}; VIEWS.ajustes.render(r); avisar('Instagram conectado!'); })
          .catch(function (e) { $('#ig-erro').textContent = textoErro(e); btn.disabled = false; btn.textContent = 'Conectar Instagram'; });
      });
      var ftr = $('#form-treino');
      ftr.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var btn = ftr.querySelector('[type=submit]'); btn.disabled = true;
        api('salvarInstrucoesIA', { texto: ftr.texto.value }).then(function (r) { VIEWS.ajustes.render(r); avisar('Instruções salvas. O atendente já usa nas próximas respostas.'); })
          .catch(function (e) { $('#treino-erro').textContent = textoErro(e); btn.disabled = false; });
      });
      var fia = $('#form-ia');
      if (fia) fia.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var btn = fia.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = 'Conferindo a chave…';
        api('salvarChaveIA', { chave: fia.chave.value }).then(function (r) { VIEWS.ajustes.render(r); avisar('Atendente ligado no site!'); })
          .catch(function (e) { $('#ia-erro').textContent = textoErro(e); btn.disabled = false; btn.textContent = 'Salvar chave e ligar'; });
      });
      var ial = $('#ia-ligar');
      if (ial) ial.addEventListener('click', function () { ial.disabled = true; api('ligarIA', { ligar: !a.iaLigada }).then(function (r) { VIEWS.ajustes.render(r); avisar(r.iaLigada ? 'Atendente ligado.' : 'Atendente desligado.'); }).catch(function (e) { avisar(textoErro(e)); ial.disabled = false; }); });
      var iaa = $('#ia-apagar');
      if (iaa) confirmarDuplo(iaa, 'Toque de novo para remover', function () { return api('apagarChaveIA').then(function (r) { VIEWS.ajustes.render(r); avisar('Chave removida. O chat saiu do site.'); }); });
      var des = $('#ig-desligar');
      if (des) confirmarDuplo(des, 'Toque de novo para desconectar', function () { return api('desligarInstagram').then(function (r) { S.cache = {}; VIEWS.ajustes.render(r); avisar('Instagram desconectado.'); }); });
      var fs = $('#form-senha');
      $('#gerar-senha').addEventListener('click', function () {
        // Senha aleatória de 16 caracteres, sem letras parecidas (0/O, 1/l/I).
        var letras = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789', n = new Uint32Array(16), s = '';
        crypto.getRandomValues(n);
        for (var i = 0; i < 16; i++) { s += letras[n[i] % letras.length]; if (i === 3 || i === 7 || i === 11) s += '-'; }
        fs.nova.value = s; fs.nova.type = 'text';
        var g = $('#senha-gerada'); g.hidden = false;
        g.innerHTML = 'Nova senha: <b style="font-family:monospace;font-size:15px;color:var(--amarelo)">' + esc(s) + '</b><br>Anote num lugar seguro (ou deixe o navegador salvar) antes de tocar em <b>Trocar senha</b>.';
        try { navigator.clipboard.writeText(s).then(function () { g.innerHTML += '<br>Já copiei para você colar.'; }, function () {}); } catch (e) {}
      });
      fs.addEventListener('submit', function (ev) {
        ev.preventDefault();
        if (fs.nova.value.length < 6) { $('#senha-erro').textContent = 'A nova senha precisa ter pelo menos 6 caracteres.'; return; }
        api('trocarSenha', { atual: fs.atual.value, nova: fs.nova.value }).then(function (t) { guardarToken(t); fs.reset(); $('#senha-erro').textContent = ''; avisar('Senha trocada.'); })
          .catch(function (e) { $('#senha-erro').textContent = textoErro(e); });
      });
      $('#sair').addEventListener('click', function () { guardarToken(''); S.cache = {}; mostrarLogin(); });
    }
  };

  /* ───────── Folha (janela de baixo) ───────── */
  var focoAntes = null;
  function abrirFolha(html) {
    focoAntes = focoAntes || document.activeElement;
    $('#folha-corpo').innerHTML = html;
    $('#folha').hidden = false;
    document.body.style.overflow = 'hidden';
    setTimeout(function () { ($('.folha .fechar')).focus(); }, 30);
  }
  function fecharFolha() {
    if ($('#folha').hidden) return;
    $('#folha').hidden = true; $('#folha-corpo').innerHTML = '';
    document.body.style.overflow = '';
    if (focoAntes && document.contains(focoAntes)) focoAntes.focus();
    focoAntes = null;
  }
  $$('[data-fechar]').forEach(function (b) { b.addEventListener('click', fecharFolha); });
  document.addEventListener('keydown', function (e) { if (e.key !== 'Escape') return; if (!$('#folha').hidden) fecharFolha(); else if (!$('#chat').hidden) voltarDoChat(); });

  /* Atualiza sozinho a cada 2 minutos quando o painel está aberto */
  setInterval(function () {
    if (document.visibilityState === 'visible' && !$('#painel').hidden && $('#folha').hidden && $('#chat').hidden && (S.aba === 'inicio' || S.aba === 'mensagens')) ir(S.aba);
  }, 120000);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && !$('#painel').hidden && $('#folha').hidden && $('#chat').hidden && S.token) ir(S.aba);
  });

  /* Começo */
  if (S.token) abrirPainel(); else mostrarLogin();
})();
</script>
